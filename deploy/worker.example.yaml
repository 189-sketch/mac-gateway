# Worker manifest for a Mac. This file is the only place that decides what the
# machine will run: the gateway can name a capability here, but can't add one.
#
# Relative paths are resolved from this file's directory.

gateway_url: https://fleet.example.com
token_file: token # Must be chmod 600.
state_dir: state
# How much to log: debug, info (the default), warn or error. At debug, the log
# also has each command's output, which can include what a job was given.
# log_level: info

# Tools can also go in a tools folder next to this file, one per .yaml file. Start
# one from a template with: fleet-worker tools new NAME --template TEMPLATE
# Changes to either take effect without a restart.

# The configuration page, opened with: fleet-worker ui --config worker.yaml
# It must be on this machine. Set it to off to turn the page off.
# ui_listen: 127.0.0.1:7878

node:
  name: mac-mini-1 # Must match the name given to `fleet-gateway node add`.
  max_jobs: 2
  labels:
    os: macos
  resources:
    cpu_heavy: 1

capabilities:
  - name: tts.say
    adapter: cli
    # Each list item is one argument and there is no shell, so input can't inject
    # commands. The text goes through stdin, so it can't be read as an option.
    command: [/usr/bin/say, -o, "{{workdir}}/out.aiff"]
    stdin: "{{input.text}}"
    input_schema:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
    # A path inside the job's working directory. The result is named audio.aiff.
    outputs:
      audio: out.aiff
    requires:
      cpu_heavy: 1
    timeout: 10m
    # Rerunning is safe here because it only produces a file. Leave this false for
    # anything with side effects that must not happen twice.
    retry_if_lost: true
    # What `fleet test` runs, to show this works from start to finish. Without this,
    # the capability can't be tested. Use input that's safe to run again and again.
    test:
      input: { text: "Fleet test" }

  # A capability that takes a file. Uncomment it after installing ffmpeg, and use
  # the path `which ffmpeg` prints. The agent sends the file with:
  #   fleet run video.transcode -f source=clip.mov -o out.mp4
  #
  # - name: video.transcode
  #   adapter: cli
  #   command: [/opt/homebrew/bin/ffmpeg, -nostdin, -i, "{{files.source}}", "{{workdir}}/out.mp4"]
  #   input_schema: { type: object }
  #   input_files: [source]
  #   outputs:
  #     video: out.mp4
  #   progress:
  #     regex: "time=(?P<current>[0-9:.]+)"
  #   requires:
  #     cpu_heavy: 1
  #   timeout: 2h
  #   retry_if_lost: true

  # A service already running on this machine. The README's "Add a service"
  # section explains these settings, and http_async for services with a job queue.
  #
  # - name: llm.generate
  #   adapter: http
  #   request:
  #     url: http://127.0.0.1:11434/api/generate
  #     json:
  #       model: llama3
  #       prompt: "{{input.prompt}}"
  #       stream: false
  #   response:
  #     result: json
  #     result_field: response
  #   input_schema:
  #     type: object
  #     required: [prompt]
  #     properties:
  #       prompt: { type: string }
  #   timeout: 10m
  #   # Optional. The worker checks each capability and tells the gateway when it
  #   # changes, and jobs only go to machines where it's ready. With no check, it
  #   # connects to the service's host and port every 30 seconds.
  #   check:
  #     url: http://127.0.0.1:11434/api/tags
  #     every: 30s
  #     timeout: 10s
